<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
body{margin:0;background:#070A14;color:#fff;font-family:system-ui}
.top{background:#0B1229;padding:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a2a5e}
.badge{background:#121f4a;padding:6px 12px;border-radius:20px;font-size:12px}
.card{margin:15px;background:#111A33;border:1px solid #22346E;border-radius:12px;padding:15px}
.btn{width:100%;padding:14px;background:#0050FF;border:0;border-radius:10px;color:#fff;font-weight:bold;font-size:16px;margin-top:10px}
.solde{font-size:32px;font-weight:900;color:#00FF88}
</style>
</head>
<body>

<div class="top">
<div>NOVA<span style="color:#0050FF"> INVESTING</span></div>
<div class="badge">FLUX BUS LIVE</div>
</div>

<div style="padding:15px">
<button id="loginBtn" class="btn" style="background:white;color:black">Se connecter avec Gmail</button>
<button id="logoutBtn" style="display:none" onclick="firebase.auth().signOut()">Déconnexion</button>

<div class="card">
<div>Mon tableau de bord</div>
<div id="solde" class="solde">$0.00</div>
<div id="details" style="font-size:12px;opacity:0.7">Lien parrainage 5 niveaux...</div>
</div>

<div class="card">
Adresse Dépôt TRC20: TVSmvbd...
<br>Adresse EVM: 0x7806...
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDQjVjW0QPOzNeLOI_3h5xVv",
  authDomain: "novainvesting-1e9b4.firebaseapp.com",
  projectId: "novainvesting-1e9b4",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

document.getElementById('loginBtn').onclick = () => {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
};

auth.onAuthStateChanged(user => {
  if(user){
    document.getElementById('loginBtn').style.display='none';
    document.getElementById('logoutBtn').style.display='block';
    // ECOUTE TES 1500$ EN DIRECT BOSS
    db.collection("utilisateurs").doc(user.uid).onSnapshot(doc=>{
      if(doc.exists){
        const d = doc.data();
        document.getElementById('solde').innerText = (d.soldeUSDT || 0) + " USDT";
        document.getElementById('details').innerText = "Investi: "+(d.totalInvestiUSDT||0)+" | Gagné: "+(d.totalGagneUSDT||0)+" | Parrain: "+(d.codeParrain||"NOVA");
      } else {
        // CREATION AUTO SI PAS EXISTE
        db.collection("utilisateurs").doc(user.uid).set({
          soldeUSDT: 1500,
          totalInvestiUSDT: 0,
          totalGagneUSDT: 0,
          email: user.email,
          codeParrain: "NOVA"+user.uid.substring(0,4)
        });
      }
    });
  }
});
</script>
</body>
</html>
