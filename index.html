<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA - Crypto $US</title>
<style>body{background:#0a0e1a;color:#fff;font-family:Arial;margin:0}
.row{display:flex;justify-content:space-between;padding:16px;border-bottom:1px solid #1a2036}
.ico{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
.btc{background:#f7931a}.eth{background:#627eea}.usdt{background:#26a17b}.bnb{background:#f3ba2f;color:#000}.sol{background:#9945ff}
.up{background:#0ecb81;padding:6px 10px;border-radius:6px}
.down{background:#f6465d;padding:6px 10px;border-radius:6px}
</style></head><body>
<div style="padding:12px;background:#0f1423;font-weight:bold">NOVA INVESTING - <span style="color:#0ecb81">● FLUX CONNECTÉ - $US</span></div>
<div id="list">Chargement...</div>
<script>
const coins=['bitcoin','ethereum','tether','binancecoin','solana'];
async function load(){
const r=await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids='+coins.join(',')+'&price_change_percentage=24h');
const d=await r.json();
let h='';
d.forEach(x=>{
let c=x.price_change_percentage_24h;let up=c>=0;
h+=`<div class=row><div style=display:flex;gap:10px;align-items:center><div class="ico ${x.id=='bitcoin'?'btc':x.id=='ethereum'?'eth':x.id=='tether'?'usdt':x.id=='binancecoin'?'bnb':'sol'}">${x.symbol[0].toUpperCase()}</div><b>${x.symbol.toUpperCase()}</b></div><div style=display:flex;gap:10px><b>$${x.current_price}</b><span class=${up?'up':'down'}>${up?'+':''}${c.toFixed(2)}%</span></div></div>`;
});
document.getElementById('list').innerHTML=h;
}
load();setInterval(load,30000);
</script></body></html>
